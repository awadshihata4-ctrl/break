<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مراقبة البريك - Break Monitor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        :root { 
            --bg-color: #f4f6f9; 
            --card-bg: #ffffff; 
            --text-color: #2c3e50; 
            --btn-start: #0f9d58; 
            --btn-end: #db4437; 
            --status-available: #0f9d58; 
            --status-break: #f4b400; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); padding: 20px; color: var(--text-color); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 26px; font-weight: 700; color: #1a1a2e; }
        .header p { font-size: 14px; color: #666; margin-top: 5px; }
        
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 18px; 
            max-width: 1500px; 
            margin: 0 auto; 
        }
        
        .agent-card { 
            background: var(--card-bg); 
            border-radius: 14px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.07); 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border-top: 5px solid #ccc;
            transition: all 0.3s ease;
        }
        .agent-card.on-break { border-top-color: var(--status-break); background: #fffdf5; }
        .agent-card.available { border-top-color: var(--status-available); }
        
        .agent-name { 
            font-size: 16px; 
            font-weight: 700; 
            color: #1a1a2e; 
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px dashed #e0e0e0;
            line-height: 1.3;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .status-badge { 
            font-size: 12px; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-weight: 700; 
            text-align: center;
            align-self: center;
        }
        .status-badge.available { background: #e6f4ea; color: var(--status-available); }
        .status-badge.break { background: #fef7e0; color: #b06000; }
        
        .schedule-info { 
            display: flex; 
            justify-content: center;
            gap: 8px; 
            font-size: 12px; 
            color: #555; 
        }
        .schedule-info span { 
            background: #f1f3f5; 
            padding: 5px 10px; 
            border-radius: 8px; 
            font-weight: 600; 
        }
        
        .stats { 
            display: flex; 
            justify-content: space-around; 
            background: #f8f9fa; 
            padding: 8px; 
            border-radius: 10px; 
            font-size: 12px; 
            font-weight: 700; 
            color: #444; 
        }
        
        .log-entry { 
            font-size: 11px; 
            color: #666; 
            background: #f1f3f5; 
            padding: 5px; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: 600;
        }
        
        .btn { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 10px; 
            font-family: 'Cairo', sans-serif; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }
        .btn-start { background: var(--btn-start); color: white; }
        .btn-start:hover { background: #0b8043; transform: translateY(-2px); }
        .btn-end { background: var(--btn-end); color: white; animation: pulse 1.5s infinite; }
        .btn-end:hover { background: #b31412; }
        
        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.02); } 
            100% { transform: scale(1); } 
        }
        
        .timer-display { 
            text-align: center; 
            font-size: 20px; 
            font-weight: 700; 
            color: #b06000; 
            background: #fef7e0; 
            padding: 8px; 
            border-radius: 10px; 
            letter-spacing: 2px; 
            font-variant-numeric: tabular-nums; 
        }
        
        .loading { text-align: center; padding: 40px; font-size: 16px; color: #666; }
        .error-box { background: #fce8e6; color: #c5221f; padding: 15px; border-radius: 8px; text-align: center; max-width: 600px; margin: 20px auto; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 لوحة مراقبة فترات الراحة (Breaks)</h1>
        <p>كل موظف له كارت وزرار خاص به | يتم التصفير تلقائياً كل يوم الساعة 12 بالليل</p>
    </div>
    <div class="dashboard" id="dashboard">
        <div class="loading">⏳ جاري تحميل البيانات...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://fqxwhsammdpdhfsiomxo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxeHdoc2FtbWRwZGhmc2lvbXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzExODgsImV4cCI6MjEwNTY0NzE4OH0.eJhquiOyvB7yImJbaUgkhorgnhUpViSfbM8zmc2icq0';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== قائمة كل موظف لوحده مع مواعيده ==========
        const agentsData = [
            { id: '1-1', name: 'Abouzald', break1: 'AM 09:20', break2: 'PM 01:00' },
            { id: '1-2', name: 'Mohamed Sayed', break1: 'AM 09:20', break2: 'PM 01:00' },
            { id: '1-3', name: 'Reda mahmoud', break1: 'AM 09:20', break2: 'PM 01:00' },
            { id: '2-1', name: 'Zenab sayed', break1: 'AM 09:40', break2: 'PM 01:20' },
            { id: '2-2', name: 'Salma hussein', break1: 'AM 09:40', break2: 'PM 01:20' },
            { id: '3-1', name: 'Mona Hassan', break1: 'AM 10:00', break2: 'PM 01:40' },
            { id: '3-2', name: 'Mariam ahmed', break1: 'AM 10:00', break2: 'PM 01:40' },
            { id: '4-1', name: 'Aliaa Tarek', break1: 'AM 10:20', break2: 'PM 02:00' },
            { id: '4-2', name: 'Omnia Ashraf', break1: 'AM 10:20', break2: 'PM 02:00' },
            { id: '5-1', name: 'Rawan Ahmed', break1: 'AM 10:40', break2: 'PM 02:20' },
            { id: '5-2', name: 'Rokaya Ismail', break1: 'AM 10:40', break2: 'PM 02:20' },
            { id: '6-1', name: 'Hagar Ezat', break1: 'AM 11:00', break2: 'PM 02:40' },
            { id: '6-2', name: 'Heba tarek', break1: 'AM 11:00', break2: 'PM 02:40' },
            { id: '7-1', name: 'Nadin ali', break1: 'AM 11:20', break2: 'PM 03:00' },
            { id: '7-2', name: 'Noran Sayed', break1: 'AM 11:20', break2: 'PM 03:00' },
            { id: '7-3', name: 'nermin ali', break1: 'AM 11:20', break2: 'PM 03:00' },
            { id: '8-1', name: 'Esraa Aly', break1: 'AM 11:40', break2: 'PM 03:20' },
            { id: '8-2', name: 'Esraa moustafa', break1: 'AM 11:40', break2: 'PM 03:20' },
            { id: '9-1', name: 'Menna', break1: 'PM 12:00', break2: 'PM 03:40' },
            { id: '9-2', name: 'Aliaa Saber', break1: 'PM 12:00', break2: 'PM 03:40' }
        ];

        const BREAK_DURATION_MINUTES = 20;
        let appState = {};

        // ========== تاريخ اليوم بصيغة YYYY-MM-DD ==========
        function getTodayDate() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function initDatabase() {
            for (const agent of agentsData) {
                const { error } = await supabaseClient
                    .from('breaks')
                    .upsert({
                        agent_id: agent.id,
                        agent_name: agent.name,
                        break1_schedule: agent.break1,
                        break2_schedule: agent.break2
                    }, { onConflict: 'agent_id', ignoreDuplicates: true });
                if (error && error.code !== '23505') console.error('Init error:', error);
            }
        }

        // ========== التصفير التلقائي كل يوم ==========
        async function checkAndResetDaily() {
            const today = getTodayDate();
            
            // جلب آخر تاريخ تصفير محفوظ في localStorage
            const lastResetDate = localStorage.getItem('breakSystemLastReset');
            
            if (lastResetDate !== today) {
                // اليوم اتغير، فلازم نصفر
                console.log('🔄 يوم جديد! يتم التصفير التلقائي...');
                
                const { error } = await supabaseClient
                    .from('breaks')
                    .update({
                        total_breaks: 0,
                        total_break_minutes: 0,
                        last_break_duration: 0
                    })
                    .neq('agent_id', '___never_match___'); // تحديث كل الصفوف
                
                if (error) {
                    console.error('Reset error:', error);
                } else {
                    localStorage.setItem('breakSystemLastReset', today);
                    console.log('✅ تم التصفير بنجاح لتاريخ:', today);
                }
            }
        }

        async function fetchState() {
            const { data, error } = await supabaseClient.from('breaks').select('*');
            if (error) {
                document.getElementById('dashboard').innerHTML = 
                    '<div class="error-box">❌ خطأ في الاتصال بقاعدة البيانات: ' + error.message + '</div>';
                return;
            }
            appState = {};
            data.forEach(row => {
                appState[row.agent_id] = {
                    onBreak: row.on_break || false,
                    startTime: row.start_time ? new Date(row.start_time).getTime() : null,
                    endTime: row.end_time ? new Date(row.end_time).getTime() : null,
                    totalBreaks: row.total_breaks || 0,
                    totalBreakMinutes: row.total_break_minutes || 0,
                    lastBreakDuration: row.last_break_duration || 0
                };
            });
            renderDashboard();
        }

        async function updateStateInDB(agentId) {
            const state = appState[agentId];
            if (!state) return;
            const { error } = await supabaseClient
                .from('breaks')
                .update({
                    on_break: state.onBreak,
                    start_time: state.startTime ? new Date(state.startTime).toISOString() : null,
                    end_time: state.endTime ? new Date(state.endTime).toISOString() : null,
                    total_breaks: state.totalBreaks,
                    total_break_minutes: state.totalBreakMinutes,
                    last_break_duration: state.lastBreakDuration
                })
                .eq('agent_id', agentId);
            if (error) console.error('Update error:', error);
        }

        window.startBreak = async function(agentId) {
            const state = appState[agentId];
            if (!state || state.onBreak) return;
            state.onBreak = true;
            state.startTime = Date.now();
            state.endTime = Date.now() + (BREAK_DURATION_MINUTES * 60 * 1000);
            await updateStateInDB(agentId);
            renderDashboard();
        };

        window.endBreak = async function(agentId) {
            const state = appState[agentId];
            if (!state || !state.onBreak) return;
            const durationMs = Date.now() - state.startTime;
            const durationMinutes = Math.round(durationMs / 60000);
            state.onBreak = false;
            state.lastBreakDuration = durationMinutes;
            state.totalBreaks += 1;
            state.totalBreakMinutes += durationMinutes;
            state.startTime = null;
            state.endTime = null;
            await updateStateInDB(agentId);
            renderDashboard();
        };

        function renderDashboard() {
            const container = document.getElementById('dashboard');
            const now = Date.now();
            
            container.innerHTML = agentsData.map(agent => {
                const state = appState[agent.id] || { onBreak: false, totalBreaks: 0, totalBreakMinutes: 0, lastBreakDuration: 0 };
                const isOnBreak = state.onBreak;
                let timerText = '';
                if (isOnBreak && state.endTime) {
                    const remaining = state.endTime - now;
                    if (remaining > 0) {
                        const mins = Math.floor(remaining / 60000);
                        const secs = Math.floor((remaining % 60000) / 1000);
                        timerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    } else {
                        timerText = 'انتهى الوقت!';
                    }
                }
                const lastBreakText = state.lastBreakDuration > 0 
                    ? `آخر بريك: ${state.lastBreakDuration} دقيقة` 
                    : 'لا يوجد بريك سابق';

                return `
                    <div class="agent-card ${isOnBreak ? 'on-break' : 'available'}">
                        <div class="agent-name">${agent.name}</div>
                        
                        <div class="status-badge ${isOnBreak ? 'break' : 'available'}">
                            ${isOnBreak ? '🟠 في بريك' : '🟢 متاح'}
                        </div>
                        
                        <div class="schedule-info">
                            <span>⏰ ${agent.break1}</span>
                            <span>⏰ ${agent.break2}</span>
                        </div>
                        
                        <div class="stats">
                            <span>📊 عدد البريك: ${state.totalBreaks || 0}</span>
                            <span>⏱️ الإجمالي: ${state.totalBreakMinutes || 0} دقيقة</span>
                        </div>
                        
                        <div class="log-entry">${lastBreakText}</div>
                        
                        ${isOnBreak && timerText ? `<div class="timer-display">⏳ ${timerText}</div>` : ''}
                        
                        <div class="action-area">
                            ${!isOnBreak 
                                ? `<button class="btn btn-start" onclick="startBreak('${agent.id}')">▶️ بدء البريك</button>`
                                : `<button class="btn btn-end" onclick="endBreak('${agent.id}')">⏹️ إنهاء البريك</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        function subscribeToRealtime() {
            supabaseClient
                .channel('public:breaks')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'breaks' }, (payload) => {
                    fetchState();
                })
                .subscribe((status) => {
                    console.log('Realtime status:', status);
                });
        }

        setInterval(() => {
            const anyoneOnBreak = Object.values(appState).some(s => s.onBreak);
            if (anyoneOnBreak) renderDashboard();
        }, 1000);

        // ========== فحص التصفير كل دقيقة ==========
        setInterval(checkAndResetDaily, 60000);

        async function init() {
            await checkAndResetDaily(); // فحص فوري عند فتح الصفحة
            await initDatabase();
            await fetchState();
            subscribeToRealtime();
        }

        init();
    </script>
</body>
</html>
